[workspace]
resolver = "3"
members = [
    "crates/janus-core",
    "crates/janus-channel",
    "crates/janus-cli",
    "crates/janus-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Leo Pellandini"]
publish = false

[workspace.dependencies]
janus-core = { path = "crates/janus-core" }
janus-channel = { path = "crates/janus-channel" }

# --- Cryptographic primitives (never re-implemented here) ---
ml-kem = "0.3.3"
ml-dsa = "0.1.1"
x25519-dalek = "3.0.0"
ed25519-dalek = "3.0.0"
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.1"
chacha20poly1305 = "0.11.0"
zeroize = { version = "1.9.1", features = ["derive"] }
subtle = "2.6.1"
rand_core = "0.10.1"
getrandom = "0.4.3"

# --- Tooling ---
thiserror = "2.0.21"
hex = "0.4.3"
proptest = "1.12.0"
criterion = "0.8.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync"] }
clap = { version = "4.6.7", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# No panics reachable from network input: these are denied in library code.
# Tests opt back in locally with `#[allow(...)]`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
debug = 1

[profile.bench]
debug = 1
