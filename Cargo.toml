[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/janus-core",
    "crates/janus-channel",
    "crates/janus-cli",
    "crates/janus-bench",
    "crates/janus-wasm",
    "crates/janus-tokio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Leo Pellandini"]
publish = false

[workspace.dependencies]
janus-core = { path = "crates/janus-core" }
janus-channel = { path = "crates/janus-channel" }
janus-tokio = { path = "crates/janus-tokio" }

# --- Cryptographic primitives (never re-implemented here) ---
ml-kem = { version = "0.3.3", default-features = false, features = ["zeroize"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize", "precomputed-tables"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
sha2 = { version = "0.11.1", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }
subtle = "2.6.1"
rand_core = "0.10.1"
getrandom = { version = "0.4.3", features = ["sys_rng"] }

# --- Tooling ---
thiserror = "2.0.21"
hex = "0.4.3"
proptest = "1.12.0"
criterion = "0.8.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["Window", "Performance"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chacha20 = { version = "0.10.2", default-features = false, features = ["rng"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# No panics reachable from network input: these are denied in library code.
# Tests opt back in locally with `#[allow(...)]`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
debug = 1

[profile.bench]
debug = 1

# ML-DSA and ML-KEM are very slow unoptimised; keep debug builds of
# dependencies optimised so that `cargo test` stays usable.
[profile.dev.package."*"]
opt-level = 2
